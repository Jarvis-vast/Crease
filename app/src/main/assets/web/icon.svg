<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0F1A36"/>
    </linearGradient>
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#4EE49B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="#1B2A52" stroke-width="4"/>

  <!-- Pitch Crease Lines -->
  <!-- Return Crease Left & Right -->
  <line x1="120" y1="200" x2="120" y2="400" stroke="#1B2A52" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="200" x2="392" y2="400" stroke="#1B2A52" stroke-width="6" stroke-linecap="round"/>
  <!-- Popping Crease (Glowing Turf Line) -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="url(#creaseGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Three Golden Stumps -->
  <!-- Middle Stump -->
  <rect x="242" y="140" width="28" height="220" rx="6" fill="url(#goldGrad)"/>
  <!-- Left Stump -->
  <rect x="194" y="160" width="26" height="200" rx="6" fill="url(#goldGrad)"/>
  <!-- Right Stump -->
  <rect x="292" y="160" width="26" height="200" rx="6" fill="url(#goldGrad)"/>
  <!-- Bails -->
  <rect x="186" y="130" width="66" height="14" rx="4" fill="#FFE082"/>
  <rect x="260" y="130" width="66" height="14" rx="4" fill="#FFE082"/>

  <!-- Dynamic Cricket Ball Striking the Crease -->
  <circle cx="370" cy="190" r="52" fill="url(#ballGrad)"/>
  <!-- Ball Seam Detail -->
  <path d="M336 170 Q370 190 394 224" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="8 4"/>

  <!-- Brand Typography Badge: OM'S CREASE -->
  <g transform="translate(256, 435)">
    <rect x="-140" y="-24" width="280" height="40" rx="12" fill="#00A86B"/>
    <text text-anchor="middle" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="3">OM'S CREASE</text>
  </g>
</svg>
